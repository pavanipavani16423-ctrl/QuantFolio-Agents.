# Render Blueprint: the backend (API + hosted A2A agents) as one Docker web service.
# Database: Neon Postgres (DATABASE_URL). Frontend: Vercel (web/). Steps: docs/DEPLOY.md.
services:
  - type: web
    name: quantfolio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # the embedding and reranker models need about 1 GB of memory once loaded; the 512 MB plans
    # (free, starter) run out of memory. Standard = 2 GB.
    plan: standard
    region: singapore          # next to Neon's aws-ap-southeast-1; pick the region of your Neon project
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false            # entered in the dashboard, never committed
      - key: DATABASE_URL
        sync: false            # Neon connection string, exactly as Neon shows it
      - key: CORS_ORIGINS
        sync: false            # ["https://<your-app>.vercel.app"]
      - key: CORS_ORIGIN_REGEX
        sync: false            # optional: https://<your-app>-.*\.vercel\.app for preview deployments
      - key: APPROVAL_SECRET
        generateValue: true    # signs approval tokens; stable across restarts and deploys
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      - key: LANGFUSE_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
