# Render Blueprint: the backend (API + hosted A2A agents) as one Docker web service on the free
# plan. Database: Neon Postgres (DATABASE_URL). Frontend: Vercel (web/). Steps: docs/DEPLOY.md;
# scripts/deploy.py creates the same service through Render's API.
services:
  - type: web
    name: quantfolio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                 # 512 MB, 0.1 CPU; sleeps after 15 idle minutes
    region: singapore          # next to the Neon project (aws-ap-southeast-1)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # lean mode for the free plan (scripts/check_free_plan.py runs a whole plan at 512 MB, 0.1 CPU in CI)
      - key: ONLINE_EVALUATION
        value: "false"         # no background RAGAS judging; the deterministic checks still run
      - key: RAG_RERANK_TOP
        value: "10"            # rerank depth 10: same hit rate as 20 in the sweep, half the CPU
      - key: ONNX_THREADS
        value: "1"
      - key: ONNX_MEMORY_ARENA
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false            # entered in the dashboard, never committed
      - key: DATABASE_URL
        sync: false            # Neon connection string, exactly as Neon shows it
      - key: CORS_ORIGINS
        sync: false            # ["https://<your-app>.vercel.app"]
      - key: CORS_ORIGIN_REGEX
        value: https://quantfolio-agents(-[a-z0-9-]+)?\.vercel\.app
      - key: APPROVAL_SECRET
        generateValue: true    # signs approval tokens; stable across restarts and deploys
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      - key: LANGFUSE_ENVIRONMENT
        value: production
