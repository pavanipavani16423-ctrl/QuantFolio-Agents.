name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantfolio
          POSTGRES_PASSWORD: quantfolio
          POSTGRES_DB: quantfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantfolio" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('app/config.py') }}
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - name: tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://quantfolio:quantfolio@localhost:5432/quantfolio_test' || '' }}
        run: uv run pytest -q -p no:logging

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quantfolio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: start it, run a whole plan, and report its memory (free-tier settings)
        run: |
          # 512 MB is the memory of the free hosting tiers: the container must run a plan within it
          docker run -d --name api -p 8000:8000 --memory 512m -e LLM_PROVIDER=mock \
            -e ONLINE_EVALUATION=false -e RAG_RERANK_TOP=10 quantfolio-api:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/health | grep -q '"rag_index_ready":true' && break
            sleep 2
          done
          curl -fs http://localhost:8000/health
          started=$(docker stats --no-stream --format '{{.MemUsage}}' api)
          id=$(curl -fs -X POST http://localhost:8000/api/v1/runs -H 'content-type: application/json' \
            -d '{"client_id":"C-102","request":"Rebalance GreenLeaf. What climate risks do NVIDIA and NextEra disclose?"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 90); do
            status=$(curl -fs http://localhost:8000/api/v1/runs/$id | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
            [ "$status" = "awaiting_approval" ] && break
            [ "$status" = "failed" ] && { docker logs api | tail -30; exit 1; }
            sleep 2
          done
          test "$status" = "awaiting_approval"
          peak=$(docker exec api cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0)
          echo "::notice title=memory::after start ${started}; peak during a whole plan $((peak / 1048576)) MiB (limit 512 MiB); run status ${status}"
          test "$(docker inspect -f '{{.State.OOMKilled}}' api)" = "false"
      - name: build the web image
        run: docker build -t quantfolio-web:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 web
