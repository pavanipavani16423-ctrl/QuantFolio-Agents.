name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantfolio
          POSTGRES_PASSWORD: quantfolio
          POSTGRES_DB: quantfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantfolio" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('app/config.py') }}
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - name: tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://quantfolio:quantfolio@localhost:5432/quantfolio_test' || '' }}
        run: uv run pytest -q -p no:logging

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # to publish the free-plan measurement as a commit status
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quantfolio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run a whole plan within Render's free plan (512 MB, no swap, 0.1 CPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_free_plan.py quantfolio-api:ci
      - name: build the web image
        run: docker build -t quantfolio-web:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 web
