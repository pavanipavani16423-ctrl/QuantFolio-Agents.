name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantfolio
          POSTGRES_PASSWORD: quantfolio
          POSTGRES_DB: quantfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantfolio" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('app/config.py') }}
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - name: tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://quantfolio:quantfolio@localhost:5432/quantfolio_test' || '' }}
        run: uv run pytest -q -p no:logging

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # to publish the free-plan measurement as a commit status
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quantfolio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run a whole plan within Render's free plan (512 MB, no swap, 0.1 CPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run -d --name api -p 8000:8000 --memory 512m --memory-swap 512m --cpus 0.1 \
            -e LLM_PROVIDER=mock -e ONLINE_EVALUATION=false -e RAG_RERANK_TOP=10 -e ONNX_THREADS=1 \
            quantfolio-api:ci
          t0=$(date +%s)
          for i in $(seq 1 300); do
            curl -fs http://localhost:8000/health | grep -q '"rag_index_ready":true' && break
            sleep 2
          done
          ready=$(( $(date +%s) - t0 ))
          curl -fs http://localhost:8000/health
          id=$(curl -fs -X POST http://localhost:8000/api/v1/runs -H 'content-type: application/json' \
            -d '{"client_id":"C-102","request":"Rebalance GreenLeaf. What climate risks do NVIDIA and NextEra disclose?"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])')
          t1=$(date +%s)
          for i in $(seq 1 450); do
            status=$(curl -fs http://localhost:8000/api/v1/runs/$id | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
            [ "$status" = "awaiting_approval" ] && break
            [ "$status" = "failed" ] && { docker logs api | tail -30; exit 1; }
            sleep 2
          done
          plan=$(( $(date +%s) - t1 ))
          peak=$(docker exec api cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0)
          summary="ready ${ready}s, plan ${plan}s, peak $((peak / 1048576)) MiB of 512, ${status}, OOM $(docker inspect -f '{{.State.OOMKilled}}' api)"
          echo "free plan: $summary"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             -d "{\"state\": \"success\", \"context\": \"free-plan\", \"description\": \"$summary\"}" > /dev/null
          test "$status" = "awaiting_approval"
          test "$(docker inspect -f '{{.State.OOMKilled}}' api)" = "false"
      - name: build the web image
        run: docker build -t quantfolio-web:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 web
