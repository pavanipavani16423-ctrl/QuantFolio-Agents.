[project]
name = "quantfolio-agents"
version = "0.1.0"
description = "Multi-agent investment research and portfolio rebalancing with hybrid RAG, A2A, MCP, quantum (QAOA) optimization, Langfuse tracing and RAGAS evaluation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "a2a-sdk>=1.2.3",
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-community==0.4.1",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langfuse>=5.0.4",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "qiskit>=2.6.1",
    "qiskit-aer>=0.18.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "scipy>=1.17.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.5.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
